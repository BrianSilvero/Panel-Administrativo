<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Panel Fredy</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<script src="js/arranque.js"></script>
<script type="module" src="js/panel.js"></script>
</head>
<body>
<a class="skip" href="#contenido">Ir al contenido</a>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <img src="img/logo-fredy.jpg" alt="" width="40" height="40">
      <div>
        <div class="brand-name">Fredy</div>
        <div class="brand-sub">Panel de gestión</div>
      </div>
    </div>
    <nav class="nav" id="menu" aria-label="Menú del panel"></nav>
    <div class="me">
      <div><b id="me-nombre"></b><br><span class="muted" id="me-rol"></span></div>
      <button class="btn" type="button" id="salir">Salir</button>
    </div>
  </aside>
  <main class="main" id="contenido" tabindex="-1"></main>
</div>
<div class="toasts" id="avisos" role="status" aria-live="polite"></div>
</body>
</html>
